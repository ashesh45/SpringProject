<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee List - EmpSystem</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="fragments :: sidebar"></div>
<div th:replace="fragments :: sidebar-toggle"></div>

<div class="main-content">
    <div class="page-header">
        <h1>Employee List</h1>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>All Employees</h2>
            <a href="/addemp" class="btn btn-primary">+ Add Employee</a>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by first or last name..." onkeyup="searchEmployee()">
        </div>

        <div th:if="${#lists.isEmpty(emplist)}" class="empty-state">
            <div class="empty-icon">&#128101;</div>
            <p>No employees found.</p>
        </div>

        <div th:unless="${#lists.isEmpty(emplist)}">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Photo</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Gender</th>
                            <th>Company</th>
                            <th>Post</th>
                            <th>Salary</th>
                            <th>Join Date</th>
                            <th>DOB</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${emplist}">
                            <td th:text="${e.id}"></td>
                            <td>
                                <img th:if="${e.photo != null}"
                                     th:src="@{'/images/' + ${e.photo}}"
                                     alt="Photo"
                                     style="width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid #e0e0e0;">
                                <span th:if="${e.photo == null}" style="color:#bbb;">&#128100;</span>
                            </td>
                            <td th:text="${e.fname}"></td>
                            <td th:text="${e.lname}"></td>
                            <td th:text="${e.email}"></td>
                            <td th:text="${e.phone}"></td>
                            <td th:text="${e.gender}"></td>
                            <td th:text="${e.company}"></td>
                            <td th:text="${e.post}"></td>
                            <td th:text="${e.salary}"></td>
                            <td th:text="${e.joinDate}"></td>
                            <td th:text="${e.dob}"></td>
                            <td class="action-cell">
                                <a th:href="@{/editemp/{id}(id=${e.id})}" class="btn btn-warning btn-sm">Edit</a>
                                <a th:href="@{/deleteemp/{id}(id=${e.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Delete this employee?')">Delete</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="page-info" th:if="${totalPages > 0}">
                Showing page <span th:text="${currentPage + 1}"></span> of <span th:text="${totalPages}"></span>
                (<span th:text="${totalItems}"></span> total employees)
            </div>

            <div class="pagination" th:if="${totalPages > 1}">
                <a th:href="@{/emplist(page=0)}" class="page-link">&laquo;</a>
                <a th:href="@{/emplist(page=${currentPage - 1})}" th:if="${currentPage > 0}" class="page-link">&lsaquo;</a>
                <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:href="@{/emplist(page=${i})}" th:text="${i + 1}"
                       th:classappend="${i == currentPage} ? 'active' : ''" class="page-link"></a>
                </span>
                <a th:href="@{/emplist(page=${currentPage + 1})}" th:if="${currentPage < totalPages - 1}" class="page-link">&rsaquo;</a>
                <a th:href="@{/emplist(page=${totalPages - 1})}" class="page-link">&raquo;</a>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments :: sidebar-script"></div>

<script>
function searchEmployee() {
    var input = document.getElementById('searchInput');
    var filter = input.value.toLowerCase();
    var tbody = document.querySelector('table tbody');
    var rows = tbody.querySelectorAll('tr');

    rows.forEach(function(row) {
        var fname = row.cells[2].textContent.toLowerCase();
        var lname = row.cells[3].textContent.toLowerCase();
        row.style.display = (fname.includes(filter) || lname.includes(filter)) ? '' : 'none';
    });
}
</script>

</body>
</html>
