<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Department - EmpSystem</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="fragments :: sidebar"></div>
<div th:replace="fragments :: sidebar-toggle"></div>

<div class="main-content">
    <div class="page-header">
        <h1>Add Department</h1>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>Add New Department</h2>
        </div>

        <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

        <form action="/admin/add-department" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label for="deptName">Department Name</label>
                    <input type="text" id="deptName" name="deptName" class="form-control" placeholder="Enter department name" required>
                </div>
                <div class="form-group">
                    <label for="hod">Head of Department</label>
                    <input type="text" id="hod" name="hod" class="form-control" placeholder="Enter HOD name" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="Enter phone number" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Register Department</button>
        </form>
    </div>
</div>

<div th:replace="fragments :: sidebar-script"></div>

</body>
</html>
