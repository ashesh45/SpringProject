<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Employee - EmpSystem</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="fragments :: sidebar"></div>
<div th:replace="fragments :: sidebar-toggle"></div>

<div class="main-content">
    <div class="page-header">
        <h1>Edit Employee</h1>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>Update Employee</h2>
        </div>

        <form th:action="@{/updateemp}" method="post" th:object="${employee}">
            <input type="hidden" th:field="*{id}">

            <h3 class="form-section-title">Personal Information</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" th:field="*{fname}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" th:field="*{lname}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" th:field="*{phone}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" th:field="*{gender}" class="form-control">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" th:field="*{dob}" class="form-control" required>
                </div>
            </div>

            <h3 class="form-section-title">Employment Details</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="company">Company</label>
                    <input type="text" id="company" th:field="*{company}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="post">Post</label>
                    <input type="text" id="post" th:field="*{post}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="salary">Salary</label>
                    <input type="number" id="salary" th:field="*{salary}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="joinDate">Join Date</label>
                    <input type="date" id="joinDate" th:field="*{joinDate}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department" th:field="*{departments}" class="form-control">
                        <option value="">Select Department</option>
                        <option th:each="d : ${dlist}" th:value="${d.id}" th:text="${d.deptName}"></option>
                    </select>
                </div>
            </div>

            <h3 class="form-section-title">Address Details</h3>
            <div class="address-grid">
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" th:field="*{address.name}" class="form-control">
                </div>
                <div class="form-group">
                    <label for="state">State</label>
                    <input type="text" id="state" th:field="*{address.state}" class="form-control">
                </div>
                <div class="form-group">
                    <label for="zipcode">Zip Code</label>
                    <input type="text" id="zipcode" th:field="*{address.zipcode}" class="form-control">
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Update Employee</button>
            <a href="/emplist" class="btn btn-outline">Cancel</a>
        </form>
    </div>
</div>

<div th:replace="fragments :: sidebar-script"></div>

</body>
</html>
