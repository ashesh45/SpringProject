<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All Leave Requests - EmpSystem</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="fragments :: sidebar"></div>
<div th:replace="fragments :: sidebar-toggle"></div>

<div class="main-content">
    <div class="page-header">
        <h1>All Leave Requests</h1>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>All Employee Leave Requests</h2>
        </div>

        <div th:if="${#lists.isEmpty(leaves)}" class="empty-state">
            <div class="empty-icon">&#128203;</div>
            <p>No leave requests found.</p>
        </div>

        <div th:unless="${#lists.isEmpty(leaves)}" class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Employee Name</th>
                        <th>Leave Type</th>
                        <th>From Date</th>
                        <th>To Date</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="leave : ${leaves}">
                        <td th:text="${leave.id}"></td>
                        <td th:text="${leave.employee.fname + ' ' + leave.employee.lname}"></td>
                        <td th:text="${leave.leaveType}"></td>
                        <td th:text="${leave.startDate}"></td>
                        <td th:text="${leave.endDate}"></td>
                        <td th:text="${leave.reason}"></td>
                        <td>
                            <span th:text="${leave.status}"
                                  th:classappend="
                                    ${leave.status.name() == 'APPROVED'} ? 'badge badge-approved' :
                                    (${leave.status.name() == 'REJECTED'} ? 'badge badge-rejected' : 'badge badge-pending')">
                            </span>
                        </td>
                        <td class="action-cell">
                            <a th:href="@{'/admin/approve/' + ${leave.id}}" class="btn btn-success btn-sm">Approve</a>
                            <a th:href="@{'/admin/reject/' + ${leave.id}}" class="btn btn-danger btn-sm">Reject</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="fragments :: sidebar-script"></div>

</body>
</html>
