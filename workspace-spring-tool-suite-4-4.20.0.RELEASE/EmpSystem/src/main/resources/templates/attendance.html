<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendance - EmpSystem</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="fragments :: sidebar"></div>
<div th:replace="fragments :: sidebar-toggle"></div>

<div class="main-content">
    <div class="page-header">
        <h1>Attendance</h1>
        <p>Clock in / Clock out and view your attendance history</p>
    </div>

    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <!-- Today's Status -->
    <div class="card">
        <div class="card-header">
            <h2>Today's Attendance</h2>
        </div>

        <div style="display:flex; gap:24px; flex-wrap:wrap; align-items:center;">
            <!-- Status Display -->
            <div style="flex:1; min-width:200px;">
                <div th:if="${today == null}" style="text-align:center; padding:20px;">
                    <div style="font-size:48px; margin-bottom:8px;">&#9200;</div>
                    <p style="font-size:16px; color:#888;">Not yet clocked in today</p>
                </div>
                <div th:if="${today != null}" style="padding:12px 0;">
                    <table style="width:auto; border:none;">
                        <tr>
                            <td style="font-weight:600; padding:6px 16px 6px 0; border:none;">Date</td>
                            <td style="border:none;" th:text="${today.date}"></td>
                        </tr>
                        <tr>
                            <td style="font-weight:600; padding:6px 16px 6px 0; border:none;">Check In</td>
                            <td style="border:none;" th:text="${today.checkInTime}"></td>
                        </tr>
                        <tr>
                            <td style="font-weight:600; padding:6px 16px 6px 0; border:none;">Check Out</td>
                            <td style="border:none;">
                                <span th:if="${today.checkOutTime != null}" th:text="${today.checkOutTime}"></span>
                                <span th:if="${today.checkOutTime == null}" style="color:#f57c00;">Not yet checked out</span>
                            </td>
                        </tr>
                        <tr>
                            <td style="font-weight:600; padding:6px 16px 6px 0; border:none;">Status</td>
                            <td style="border:none;">
                                <span th:text="${today.status}"
                                      th:classappend="
                                        ${today.status.name() == 'PRESENT'} ? 'badge badge-approved' :
                                        (${today.status.name() == 'LATE'} ? 'badge badge-pending' : 'badge badge-rejected')">
                                </span>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>

            <!-- Action Buttons -->
            <div style="display:flex; gap:12px;">
                <form th:if="${canCheckIn}" th:action="@{/attendance/checkin}" method="post" style="margin:0;">
                    <button type="submit" class="btn btn-primary" style="padding:14px 28px; font-size:16px;">&#9654; Clock In</button>
                </form>
                <form th:if="${canCheckOut}" th:action="@{/attendance/checkout}" method="post" style="margin:0;">
                    <button type="submit" class="btn btn-warning" style="padding:14px 28px; font-size:16px;">&#9724; Clock Out</button>
                </form>
                <div th:if="${today != null and today.checkOutTime != null}" style="padding:14px 28px; background:#e8f5e9; border-radius:8px; color:#2e7d32; font-weight:600;">
                    &#10003; Today's attendance complete
                </div>
            </div>
        </div>
    </div>

    <!-- Attendance History -->
    <div class="card">
        <div class="card-header">
            <h2>Attendance History</h2>
        </div>

        <div th:if="${#lists.isEmpty(history)}" class="empty-state">
            <div class="empty-icon">&#128197;</div>
            <p>No attendance records found.</p>
        </div>

        <div th:unless="${#lists.isEmpty(history)}" class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Check In</th>
                        <th>Check Out</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="record : ${history}">
                        <td th:text="${record.date}"></td>
                        <td th:text="${record.checkInTime}"></td>
                        <td>
                            <span th:if="${record.checkOutTime != null}" th:text="${record.checkOutTime}"></span>
                            <span th:if="${record.checkOutTime == null}" style="color:#888;">--</span>
                        </td>
                        <td>
                            <span th:text="${record.status}"
                                  th:classappend="
                                    ${record.status.name() == 'PRESENT'} ? 'badge badge-approved' :
                                    (${record.status.name() == 'LATE'} ? 'badge badge-pending' : 'badge badge-rejected')">
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="fragments :: sidebar-script"></div>

</body>
</html>
