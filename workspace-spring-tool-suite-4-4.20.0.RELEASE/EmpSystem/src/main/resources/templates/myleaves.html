<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Leaves - EmpSystem</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="fragments :: sidebar"></div>
<div th:replace="fragments :: sidebar-toggle"></div>

<div class="main-content">
    <div class="page-header">
        <h1>My Leaves</h1>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>My Leave Requests</h2>
            <a href="/employee/leave-request" class="btn btn-primary">+ New Leave Request</a>
        </div>

        <div th:if="${#lists.isEmpty(leaves)}" class="empty-state">
            <div class="empty-icon">&#128221;</div>
            <p>You have not applied for any leaves yet.</p>
        </div>

        <div th:unless="${#lists.isEmpty(leaves)}" class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Leave Type</th>
                        <th>From Date</th>
                        <th>To Date</th>
                        <th>Reason</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="leave : ${leaves}">
                        <td th:text="${leave.leaveType}"></td>
                        <td th:text="${leave.startDate}"></td>
                        <td th:text="${leave.endDate}"></td>
                        <td th:text="${leave.reason}"></td>
                        <td>
                            <span th:text="${leave.status}"
                                  th:classappend="
                                    ${leave.status.name() == 'APPROVED'} ? 'badge badge-approved' :
                                    (${leave.status.name() == 'REJECTED'} ? 'badge badge-rejected' : 'badge badge-pending')">
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="fragments :: sidebar-script"></div>

</body>
</html>
