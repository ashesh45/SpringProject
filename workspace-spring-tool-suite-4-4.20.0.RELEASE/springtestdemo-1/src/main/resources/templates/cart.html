<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Cart List</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>



<div class="container mt-5">
    <div class="row">

        <!-- LOOP CART -->
        <div class="col-md-4 mb-4" th:each="cart : ${clist}">

            <div class="card shadow-sm p-3">

                <h5 class="mb-2">Cart ID: <span th:text="${cart.id}"></span></h5>

                <p class="mb-1">
                    <strong>User ID:</strong>
                    <span th:text="${cart.userId}"></span>
                </p>

                <p class="mb-2">
                    <strong>Date:</strong>
                    <span th:text="${cart.date}"></span>
                </p>
          <pre th:text="${cart.products}"></pre>
                <!-- PRODUCTS INSIDE CART -->
                <div th:each="product : ${cart.products}" class="border-top pt-2 mt-2">

                    <p class="mb-1">
                        <strong>Product ID:</strong>
                        <span th:text="${product.productId}"></span>
                    </p>

                    <p class="mb-1">
                        <strong>Quantity:</strong>
                        <span th:text="${product.quantity}"></span>
                    </p>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
