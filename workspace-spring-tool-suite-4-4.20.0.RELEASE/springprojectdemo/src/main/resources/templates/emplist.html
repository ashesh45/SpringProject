<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee List</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/emplist.css">
</head>
<body>

<div th:insert="header.html :: navbar"></div>

<div class="list-container">

    <div class="list-header">
        <h2>All Employees</h2>
        <a th:href="@{/addemp}" class="add-btn">+ Add Employee</a>
    </div>

    <div class="table-responsive-wrapper">
        <table class="table table-striped table-hover">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Gender</th>
                    <th>Company</th>
                    <th>Post</th>
                    <th>Salary</th>
                    <th>Join Date</th>
                    <th>DOB</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="e : ${EmpList}">
                    <td th:text="${e.id}"></td>
                    <td th:text="${e.fname}"></td>
                    <td th:text="${e.lname}"></td>
                    <td th:text="${e.email}"></td>
                    <td th:text="${e.phone}"></td>
                    <td th:text="${e.gender}"></td>
                    <td th:text="${e.company}"></td>
                    <td th:text="${e.post}"></td>
                    <td th:text="${e.salary}"></td>
                    <td th:text="${e.joinDate}"></td>
                    <td th:text="${e.dob}"></td>
                    <td class="action-cell">
                        <a th:href="@{/editemp/{id}(id=${e.id})}" class="edit-btn">Edit</a>
                        <a th:href="@{/deleteemp/{id}(id=${e.id})}" class="delete-btn" onclick="return confirm('Delete this employee?')">Delete</a>
                    </td>
                </tr>
            </tbody>

        </table>
    </div>

    <div class="text-muted text-center mt-3" th:if="${#lists.isEmpty(EmpList)}">
        No employees found.
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
