<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Department Form</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .container{
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2{
            text-align: center;
            color: #0d6efd;
        }

        label{
            font-weight: bold;
        }

        input[type="text"]{
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="submit"]{
            width: 100%;
            padding: 10px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        input[type="submit"]:hover{
            background-color: #084298;
        }
    </style>

</head>

<body>

<div class="container">

    <h2>Update Department</h2>

    <form th:action="@{/updatedepartment}" method="post" th:object="${department}">
		
		 <input type="hidden" name="id" th:value="${department.id}">


        <label>Department Name:</label>
        <input type="text" th:field="*{name}">

        <label>HOD:</label>
        <input type="text" th:field="*{hod}">

        <label>Phone:</label>
        <input type="text" th:field="*{phone}">

        <input type="submit" value="Update">

    </form>

</div>

</body>
</html>
