<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finance News</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/gallery.css">
    <style>
        .news-container {
            max-width: 960px;
            margin: 30px auto 50px;
        }
        .story-card {
            border: 1px solid #e9edf2;
            border-radius: 10px;
            padding: 20px 24px;
            margin-bottom: 20px;
            background: #fff;
            transition: box-shadow 0.2s ease;
        }
        .story-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .story-card h3 {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 10px;
            border: none;
            padding: 0;
        }
        .story-card p {
            color: #475569;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .story-card a.read-more {
            display: inline-block;
            font-size: 13px;
            font-weight: 600;
            color: #0d6efd;
            text-decoration: none;
        }
        .story-card a.read-more:hover {
            text-decoration: underline;
        }
        .sources {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #f1f5f9;
        }
        .source-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #64748b;
        }
        .source-item img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div th:insert="header.html :: navbar"></div>

<div class="gallery-container news-container">

    <h2>Finance News</h2>

    <div th:each="response : ${clist}">

        <p class="text-muted mb-2">
            <span th:text="${response.channel}"></span>
            &mdash;
            <span th:text="${response.story_count}"></span> stories
            &middot;
            <span th:text="${response.generated_at}"></span>
        </p>

        <div th:each="story : ${response.stories}" class="story-card">

            <h3 th:text="${story.topic_en}"></h3>

            <p th:text="${story.summary_en}"></p>

            <a th:href="${story.url}" class="read-more" target="_blank">Read more &rarr;</a>

            <div class="sources" th:if="${story.sources != null and !story.sources.isEmpty()}">
                <div class="source-item" th:each="source : ${story.sources}">
                    <img th:src="${source.image_url}" alt="" />
                    <span th:text="${source.publisher}"></span>
                </div>
            </div>

        </div>

    </div>

    <div class="text-muted text-center mt-4" th:if="${#lists.isEmpty(clist)}">
        No news available.
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
