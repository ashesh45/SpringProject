<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Registration Form</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

   <!-- Bootstrap CSS -->
   <link rel="stylesheet"
   href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

   <link rel="stylesheet" href="/css/addemp.css"> 

</head>

<body>

<div th:insert="header.html :: navbar"></div>
 <p class="text-success text-center fw-bold">
            [[${msg}]]

<div class="form-container">

    <h2>Employee Registration Form</h2>

    <form action="/addemp" method="post">

        <div class="form-row">

            <!-- First Name -->
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="fname" placeholder="Enter first name" required>
            </div>

            <!-- Last Name -->
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="lname" placeholder="Enter last name" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter email address" required>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" placeholder="Enter phone number" required>
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label>Gender</label>
                <select name="gender">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- DOB -->
            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" name="dob" required>
            </div>

            <!-- Company -->
            <div class="form-group">
                <label>Company</label>
                <input type="text" name="company" placeholder="Enter company name" required>
            </div>

            <!-- Post -->
            <div class="form-group">
                <label>Post</label>
                <input type="text" name="post" placeholder="Enter job post" required>
            </div>

            <!-- Salary -->
            <div class="form-group">
                <label>Salary</label>
                <input type="number" name="salary" placeholder="Enter salary" required>
            </div>

            <!-- Join Date -->
            <div class="form-group">
                <label>Join Date</label>
                <input type="date" name="joinDate" required>
            </div>

            <!-- Department -->
            <div class="form-group">
                <label>Department</label>
                <select name="departments">
                    <option value="">Select</option>
                    <option th:each="d : ${dlist}" th:value="${d.id}" th:text="${d.name}"></option>
                </select>
            </div>

            <!-- Projects (full width) -->
            <div class="form-group full-width">
                <label>Projects</label>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="projects" value="Project 1">
                        Project 1
                    </label>
                    <label>
                        <input type="checkbox" name="projects" value="Project 2">
                        Project 2
                    </label>
                    <label>
                        <input type="checkbox" name="projects" value="Project 3">
                        Project 3
                    </label>
                </div>
            </div>

        </div><!-- end form-row -->

        <!-- Address Section -->
        <h3>Address Details</h3>

        <div class="address-grid">
            <div class="form-group">
                <label>City</label>
                <input type="text" name="address.name" placeholder="Enter city">
            </div>

            <div class="form-group">
                <label>State</label>
                <input type="text" name="address.state" placeholder="Enter state">
            </div>

            <div class="form-group">
                <label>Zip Code</label>
                <input type="text" name="address.zipcode" placeholder="Enter zip code">
            </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn">
            Save Employee
        </button>

    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
