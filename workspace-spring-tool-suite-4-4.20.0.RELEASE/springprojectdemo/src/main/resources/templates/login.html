
	
<!DOCTYPE html>

<head>
    <title>Login Page</title>
    
    <!-- Bootstrap CSS -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    
     <link rel="stylesheet"
          href="/fonts/material-icon/css/material-design-iconic-font.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="/css/style.css">
    
</head>
<body>



<form action="/login" method="POST">


<div class="container-fluid">

    <section class="sign-in">

        <div class="signin-content">

            <!-- Left Image -->
            <div class="signin-image">
                <figure>
                    <img src="images/signin-image.jpg" alt="sign in image">
                </figure>
               

                <a href="/signup" class="signup-image-link">
                    Create an account
                </a>
               
            </div>

            <!-- Login Form -->
            <div class="signin-form">

                <h2 class="form-title">Login</h2>

                <form method="POST"
                      class="register-form"
                      id="login-form">

                    <!-- Username -->
                    <div class="form-group">

                        <label for="username">
                            <i class="zmdi zmdi-account material-icons-name"></i>
                        </label>

                        <input type="text"
                               name="username"
                               id="username"
                               placeholder="user name"/>

                    </div>

                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            <i class="zmdi zmdi-lock"></i>
                        </label>

                        <input type="password"
                               name="password"
                               id="password"
                               placeholder="Password"/>

                    </div>

                    <!-- Login Button -->
                    <div class="form-group form-button">

                        <input type="submit"
                               name="signin"
                               id="signin"
                               class="form-submit"
                               value="Log in"/>

                    </div>

                </form>

                <!-- Social Login -->
                <div class="social-login">

                    <span class="social-label">
                        Or login with
                    </span>

                    <ul class="socials">

                        <li>
                            <a href="#">
                                <i class="display-flex-center zmdi zmdi-facebook"></i>
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                <i class="display-flex-center zmdi zmdi-twitter"></i>
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                <i class="display-flex-center zmdi zmdi-google"></i>
                            </a>
                        </li>

                    </ul>

                </div>

            </div>

        </div>

    </section>

</div>

</form>



</body>
</html>
