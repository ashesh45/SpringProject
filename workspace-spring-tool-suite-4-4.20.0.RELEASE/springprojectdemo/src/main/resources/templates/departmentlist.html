

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Department List</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/departmentlist.css">
</head>
<body>

<div th:insert="header.html :: navbar"></div>
  <p class="text-success text-center fw-bold">
            [[${msg}]]
        </p>
        
    <a href="/excel" class="add-btn">Excel</a>
    <a href="/pdf" class="add-btn">Pdf</a>    

</div>  
        
<div class="export-buttons">
</div> 
<div class="list-container">

    <div class="list-header">
        <h2>All Departments</h2>
        <a href="/add-department" class="add-btn">+ Add Department</a>
    </div>

    <div class="table-responsive-wrapper">
        <table class="table table-striped table-hover">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>HOD</th>
                    <th>Phone</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="d : ${deptList}">
                    <td th:text="${d.id}"></td>
                    <td th:text="${d.name}"></td>
                    <td th:text="${d.hod}"></td>
                    <td th:text="${d.phone}"></td>
                    <td class="action-cell">
                        <a th:href="@{/editdepartment/{id}(id=${d.id})}" class="edit-btn">Edit</a>
                        <a th:href="@{/deleteDepartment/{id}(id=${d.id})}" class="delete-btn" onclick="return confirm('Delete this department?')">Delete</a>
                    </td>
                </tr>
            </tbody>

        </table>
    </div>

    <div class="text-muted text-center mt-3" th:if="${#lists.isEmpty(deptList)}">
        No departments found.
    </div>

    <div class="back-section">
        <a href="/department" class="back-btn">&larr; Back to Dashboard</a>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
